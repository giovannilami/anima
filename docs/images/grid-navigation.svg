<svg xmlns="http://www.w3.org/2000/svg" width="800" height="552" viewBox="0 0 800 552" role="img" aria-labelledby="title desc">
<title id="title">PAGE SELECTION / Grid overlay</title>
<desc id="desc">A 16-column, 8-row Grid with square pads on an equal horizontal and vertical pitch. Colors identify control groups, not physical LED colors. Coordinates are column then row; bottom-right 16,8 is the navigation modifier.</desc>
